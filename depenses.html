<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dépenses - Gestion Auditoire L2 IG</title>
    <link rel="stylesheet" href="depenses.css">
</head>
<body class="body-dashboard">

<!-- Barre de navigation latérale -->
<nav class="sidebar">
    <div class="sidebar-header">
        <h2>L2 IG</h2>
        <p id="sidebar-role-subtitle">Gestion de Dépenses</p>
    </div>
    <ul class="nav-links">
        <li><a href="acceuil.html">Tableau de bord</a></li>
        <li><a href="etudiants.html">Étudiants</a></li>
        <li><a href="contributions.html">Contributions</a></li>
        <li><a href="paiements.html">Paiements</a></li>
        <li><a href="depenses.html" class="active">Dépenses</a></li>
        <li><a href="index.html" id="btn-logout" class="logout-link">Déconnexion</a></li>
    </ul>
</nav>

    <!-- Contenu Principal -->
    <main class="main-content">
        <header class="dashboard-header">
            <h1 id="page-main-title">Gestion des Dépenses</h1>
            <div class="user-badge">
                <span>Connecté entant que : <strong id="user-role-label"></strong></span>
            </div>
        </header>

        <!-- Formulaire d'enregistrement / modification (Admin uniquement) -->
        <section class="form-section card" id="admin-form-section" style="display: none;">
            <h3 id="form-title">Enregistrer une nouvelle dépense</h3>
            <form id="form-depense">
                <input type="hidden" id="edit-index" value="-1">
                
                <div class="form-grid">
                    <div class="input-group">
                        <label for="motif">Motif de la dépense</label>
                        <input type="text" id="motif" placeholder="............................................................................." required>
                    </div>

                    <div class="input-group">
                        <label for="montant">Montant</label>
                        <input type="number" step="0.01" id="montant" placeholder="............................................................................" required>
                    </div>

                    <div class="input-group">
                        <label for="date">Date de la dépense</label>
                        <input type="date" id="date" required>
                    </div>

                    <div class="input-group">
                        <label for="beneficiaire">Bénéficiaire</label>
                        <input type="text" id="beneficiaire" placeholder="........................................................................" required>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" id="btn-annuler" class="btn-secondary" style="display:none;">Annuler</button>
                    <button type="submit" class="btn-principal" id="btn-submit">Enregistrer la dépense</button>
                </div>
            </form>
        </section>

        <!-- Tableau de la liste des dépenses -->
        <section class="table-section card">
            <h3 id="table-title">Historique des Dépenses</h3>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Motif</th>
                            <th>Montant</th>
                            <th>Date</th>
                            <th>Bénéficiaire</th>
                            <th id="th-actions">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="liste-depenses">
                        <!-- Rempli dynamiquement par JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="depenses.js"></script>
</body>
</html>
